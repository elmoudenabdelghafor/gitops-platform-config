# Loki Stack Helm Values for Local DevSecOps Platform
loki:
  enabled: true
  isDefault: false
  persistence:
    enabled: true
    storageClassName: standard
    size: 2Gi
  config:
    table_manager:
      retention_deletes_enabled: true
      retention_period: 48h

promtail:
  enabled: true
  config:
    logLevel: info
    serverPort: 3101
    clients:
      - url: http://loki.monitoring.svc:3100/loki/api/v1/push

grafana:
  enabled: false

prometheus:
  enabled: false

filebeat:
  enabled: false

logstash:
  enabled: false
