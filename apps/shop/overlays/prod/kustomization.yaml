apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop-prod

resources:
  - ../../base

patches:
  - target:
      kind: Ingress
      name: shop-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: shop.localhost
  - target:
      kind: Deployment
      name: shop-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: shop-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
