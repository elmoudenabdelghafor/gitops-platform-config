apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop-dev

resources:
- ../../base

patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: dev.shop.localhost
  target:
    kind: Ingress
    name: shop-ingress
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: ENABLE_FAULT_INJECTION
        value: "true"
  target:
    kind: Deployment
    name: shop-api
images:
- name: shop-api
  newName: ghcr.io/elmoudenabdelghafor/shop-api
  newTag: d4cf8f0fc594571639897e0a6c9690fb180621cd
- name: shop-frontend
  newName: ghcr.io/elmoudenabdelghafor/shop-frontend
  newTag: d4cf8f0fc594571639897e0a6c9690fb180621cd
