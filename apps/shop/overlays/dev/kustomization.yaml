apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop-dev

resources:
  - ../../base

patches:
  - target:
      kind: Ingress
      name: shop-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.shop.localhost
  - target:
      kind: Deployment
      name: shop-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENABLE_FAULT_INJECTION
          value: "true"
