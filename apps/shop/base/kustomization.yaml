apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - api-deployment.yaml
  - api-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - ingress.yaml

images:
  - name: shop-api
    newName: shop-api
    newTag: local
  - name: shop-frontend
    newName: shop-frontend
    newTag: local
