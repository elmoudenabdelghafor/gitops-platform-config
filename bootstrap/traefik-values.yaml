# Traefik Helm Chart Values for Kind Cluster Ingress
service:
  spec:
    type: NodePort

ports:
  web:
    nodePort: 30080
    exposedPort: 80
  websecure:
    nodePort: 30443
    exposedPort: 443

nodeSelector:
  ingress-ready: "true"

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Equal"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/master"
    operator: "Equal"
    effect: "NoSchedule"
